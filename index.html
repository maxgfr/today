<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Today — offline-first to-do</title>
    <meta
      name="description"
      content="Your day, one list. Offline-first and private: your tasks never leave your device. No account, no server, no tracking."
    />

    <link rel="icon" type="image/svg+xml" href="/today/favicon.svg" />
    <link rel="apple-touch-icon" href="/today/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f2f0" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- No crawler, no preview, no third party. This app is for one person: whoever holds the device. -->
    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="no-referrer" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Today runs entirely in your browser, so it needs JavaScript. Nothing is sent anywhere —
      enabling it does not expose you to any server.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
